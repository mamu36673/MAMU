<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Standard Page Title & Search Engine Meta Tags -->
    <title>MAMU | Muslim Association of Meru University</title>
    <meta property="og:site_name" content="MAMU" />
    <meta name="description" content="Muslim Association of Meru University (MAMU) Cloud Directory and Student Portal." />

    <!-- Structured Data to fix site name in Google Search Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MAMU",
      "alternateName": "Muslim Association of Meru University",
      "url": "https://mamu36673.github.io/MamuWeb/"
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --islamic-green: #065f46;
            --gold: #fbbf24;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: #fdfdfb;
        }
        
        .islamic-gradient {
            background: linear-gradient(135deg, #064e3b 0%, #059669 100%);
            border-bottom: 5px solid var(--gold);
        }
    </style>
</head>

<body>

    <header class="islamic-gradient text-white pt-10 pb-14 shadow-2xl">
        <div class="container mx-auto text-center px-4 flex flex-col items-center">
            <h1 class="text-3xl md:text-5xl font-bold mb-2">MAMU Cloud Directory</h1>
            <p class="text-emerald-100 italic mb-6">BISMILLAH. WELCOME ALL</p>
            
            <a href="https://mamu36673.github.io/MamuWeb/" 
               target="_blank" 
               class="inline-flex items-center gap-2 bg-emerald-950/40 hover:bg-emerald-900 border border-emerald-400/30 text-emerald-100 hover:text-white px-5 py-2.5 rounded-full text-sm font-semibold transition-all duration-200 shadow-md hover:shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back Home
            </a>
        </div>
    </header>

    <main class="container mx-auto px-4 -mt-8 pb-20">
        <div class="grid lg:grid-cols-3 gap-8">

            <section class="lg:col-span-1">
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden border-t-4 border-yellow-400 sticky top-8">
                    <form id="memberForm" class="p-6 space-y-4">
                        <h2 id="formTitle" class="text-xl font-bold text-emerald-900 mb-4">Register Student</h2>
                        <input type="hidden" id="editId">

                        <input type="text" id="name" placeholder="Full Name" required class="w-full border p-3 rounded-xl bg-gray-50 outline-emerald-500">

                        <select id="school" required class="w-full border p-3 rounded-xl bg-white outline-emerald-500">
                            <option value="">-- Select School --</option>
                            <option>School of Agriculture and Food Science</option>
                            <option>School of Business and Economics</option>
                            <option>School of Computing and Informatics</option>
                            <option>School of Education</option>
                            <option>School of Engineering and Architecture</option>
                            <option>School of Health Sciences</option>
                            <option>School of Nursing</option>
                            <option>School of Pure and Applied Sciences</option>
                        </select>

                        <input type="text" id="course" placeholder="Course" required class="w-full border p-3 rounded-xl bg-gray-50 outline-emerald-500">

                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="regNo" placeholder="Reg No" required class="border p-3 rounded-xl bg-gray-50 outline-emerald-500">
                            <select id="year" class="border p-3 rounded-xl bg-white outline-emerald-500">
                                <option>Year 1</option>
                                <option>Year 2</option>
                                <option>Year 3</option>
                                <option>Year 4</option>
                                <option>Alumni</option>
                            </select>
                        </div>

                        <input type="tel" id="phone" placeholder="Phone Number" required class="w-full border p-3 rounded-xl bg-gray-50 outline-emerald-500">

                        <div class="flex flex-col gap-2">
                            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg">
                                Save to Cloud
                            </button>
                            <button type="button" id="cancelBtn" class="hidden w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-xl transition-all">
                                Cancel Edit
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="lg:col-span-2">
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
                    <div class="p-4 bg-emerald-50 border-b flex justify-between items-center">
                        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search directory..." class="w-full max-w-sm p-2 border rounded-full px-4 outline-emerald-500">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                            <span class="text-[10px] font-black text-emerald-700 uppercase tracking-tighter">Live Sync</span>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left" id="directoryTable">
                            <thead class="bg-emerald-900 text-white text-xs uppercase">
                                <tr>
                                    <th class="px-6 py-4">Student Name</th>
                                    <th class="px-6 py-4">Academic Details</th>
                                    <th class="px-6 py-4">Onboarding Actions</th>
                                    <th class="px-6 py-4 text-center">System</th>
                                </tr>
                            </thead>
                            <tbody id="memberList" class="divide-y divide-gray-100 text-sm">
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        function filterTable() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toLowerCase();
            const table = document.getElementById("memberList");
            const tr = table.getElementsByTagName("tr");
            
            let currentHeader = null;
            let visibleInGroup = 0;

            for (let i = 0; i < tr.length; i++) {
                if (tr[i].hasAttribute('data-group-header')) {
                    if (currentHeader && visibleInGroup === 0) {
                        currentHeader.style.display = "none";
                    }
                    currentHeader = tr[i];
                    visibleInGroup = 0;
                    tr[i].style.display = ""; 
                    continue;
                }

                const text = tr[i].textContent || tr[i].innerText;
                if (text.toLowerCase().indexOf(filter) > -1) {
                    tr[i].style.display = "";
                    visibleInGroup++;
                } else {
                    tr[i].style.display = "none";
                }
            }

            if (currentHeader && visibleInGroup === 0) {
                currentHeader.style.display = "none";
            }
        }
    </script>
    <script>
        const form = document.getElementById("memberForm");
        const formTitle = document.getElementById("formTitle");
        const submitBtn = document.getElementById("submitBtn");
        const cancelBtn = document.getElementById("cancelBtn");
        const editIdInput = document.getElementById("editId");
        const memberList = document.getElementById("memberList");

        // REPLACE THIS WITH YOUR DEPLOYED GOOGLE APPS SCRIPT URL
        const SCRIPT_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE"; 
        const WHATSAPP_GROUP_LINK = "https://chat.whatsapp.com/YOUR_GROUP_INVITE_CODE";

        function formatWhatsAppNumber(phoneStr) {
            let cleaned = phoneStr.replace(/\D/g, '');
            if (cleaned.startsWith('0')) {
                cleaned = '254' + cleaned.substring(1);
            }
            return cleaned;
        }

        window.downloadVCard = (name, phone, year, regNo, course) => {
            const cleanPhone = phone.replace(/\D/g, '');

            const vcardContent = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                `N:;MAMU: ${name} (${year});;;`,
                `FN:MAMU: ${name} (${year})`,
                `TEL;TYPE=CELL:${cleanPhone}`,
                `NOTE:Reg: ${regNo} | Course: ${course}`,
                "END:VCARD"
            ].join("\n");

            const blob = new Blob([vcardContent], {
                type: "text/vcard;charset=utf-8;"
            });

            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = `${name.replace(/\s+/g, "_")}_MAMU.vcf`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.prepareEdit = (id) => {
            let members = JSON.parse(localStorage.getItem("mamu_members")) || [];
            let m = members.find(student => String(student.id) === String(id));
            
            if (!m) return;

            editIdInput.value = String(m.id);
            document.getElementById("name").value = m.name || '';
            document.getElementById("school").value = m.school || '';
            document.getElementById("course").value = m.course || '';
            document.getElementById("regNo").value = m.regNo || '';
            document.getElementById("year").value = m.year || 'Year 1';
            document.getElementById("phone").value = m.phone || '';

            formTitle.innerText = "Editing Record";
            submitBtn.innerText = "Update Member";
            cancelBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        cancelBtn.onclick = resetFormState;

        function resetFormState() {
            form.reset();
            editIdInput.value = ""; 
            formTitle.innerText = "Register Student";
            submitBtn.innerText = "Save to Cloud";
            cancelBtn.classList.add('hidden');
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const inputRegNo = document.getElementById("regNo").value.trim();
            const editId = (editIdInput.value && editIdInput.value.trim() !== "") ? String(editIdInput.value).trim() : null;
            
            let members = JSON.parse(localStorage.getItem("mamu_members")) || [];

            if (!editId) {
                const isDuplicate = members.some(student => 
                    String(student.regNo).trim().toLowerCase() === inputRegNo.toLowerCase()
                );

                if (isDuplicate) {
                    alert("Registration Error: A student with this Registration Number is already registered!");
                    return;
                }
            }

            const uniqueId = editId || (typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : 'id_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9));

            const existingMember = editId ? members.find(m => String(m.id) === editId) : null;
            const creationTime = existingMember ? existingMember.createdAt : Date.now();

            const memberData = {
                id: uniqueId,
                name: document.getElementById("name").value.trim(),
                regNo: inputRegNo,
                school: document.getElementById("school").value,
                course: document.getElementById("course").value.trim(),
                year: document.getElementById("year").value,
                phone: document.getElementById("phone").value.trim(),
                createdAt: creationTime
            };

            if (editId) {
                members = members.map(m => String(m.id) === editId ? memberData : m);
            } else {
                members.push(memberData);
            }
            
            localStorage.setItem("mamu_members", JSON.stringify(members));

            console.log("Sending to Cloud:", memberData);
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify(memberData)
                });

                const result = await response.json();

                if (result.status === "success") {
                    alert(editId ? "Student records updated successfully in Cloud!" : "Student registered successfully in Cloud.");
                } else {
                    alert("Local update saved, but failed to synchronize with cloud database.");
                }

            } catch (error) {
                console.error(error);
                alert("Saved locally! Unable to reach Google Sheets API right now.");
            }

            resetFormState();
            loadMembers();
        });

        function loadMembers() {
            let members = JSON.parse(localStorage.getItem("mamu_members")) || [];

            // AUTO-REPAIR: Assign unique IDs to old legacy entries missing an 'id'
            let needsSave = false;
            members = members.map(m => {
                if (!m.id) {
                    needsSave = true;
                    m.id = typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : 'id_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
                }
                return m;
            });

            if (needsSave) {
                localStorage.setItem("mamu_members", JSON.stringify(members));
            }

            memberList.innerHTML = "";

            const yearGroups = ["Year 1", "Year 2", "Year 3", "Year 4", "Alumni"];
            const sortedMembers = [...members].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            yearGroups.forEach(year => {
                const students = sortedMembers.filter(student => {
                    const memberYear = String(student.year || '').trim();
                    return (
                        memberYear === year ||
                        memberYear === year.replace("Year ", "")
                    );
                });

                if (!students.length) return;

                memberList.innerHTML += `
                    <tr data-group-header="true" class="bg-emerald-50/80 border-y border-emerald-100">
                        <td colspan="4" class="px-6 py-2 text-[11px] font-black text-emerald-800 uppercase tracking-widest">
                            ${year}
                            <span class="ml-2 font-medium text-emerald-400">
                                | ${students.length} ${year === 'Alumni' ? 'Members' : 'Students'}
                            </span>
                        </td>
                    </tr>
                `;

                students.forEach(m => {
                    const waPhone = formatWhatsAppNumber(m.phone || '');
                    const messageText = encodeURIComponent(`Assalam Alaykum ${m.name || 'Student'},\n\nWelcome to MAMU.\n\nJoin our WhatsApp group:\n\n${WHATSAPP_GROUP_LINK}`);
                    const waUrl = `https://wa.me/${waPhone}?text=${messageText}`;

                    const safeId = String(m.id).replace(/'/g, "\\'");
                    const safeName = String(m.name || 'Unnamed').replace(/'/g, "\\'");
                    const safePhone = String(m.phone || '').replace(/'/g, "\\'");
                    const safeYear = String(m.year || '').replace(/'/g, "\\'");
                    const safeRegNo = String(m.regNo || '').replace(/'/g, "\\'");
                    const safeCourse = String(m.course || '').replace(/'/g, "\\'");

                    memberList.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4">
                                <div class="font-bold text-emerald-900">${m.name || 'Unnamed'}</div>
                                <div class="text-[10px] text-gray-400 font-mono uppercase">${m.regNo || ''}</div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="text-xs font-semibold text-gray-500 uppercase">${m.school || ''}</div>
                                <div class="text-sm text-emerald-600">${m.course || ''}</div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="flex gap-2">
                                    <button
                                        onclick="downloadVCard('${safeName}','${safePhone}','${safeYear}','${safeRegNo}','${safeCourse}')"
                                        class="text-[11px] font-bold bg-white border border-gray-300 px-2 py-1 rounded-lg">
                                        Save Contact
                                    </button>
                                    <a href="${waUrl}" target="_blank" class="text-[11px] font-bold bg-emerald-600 text-white px-2 py-1 rounded-lg">
                                        Send Invite
                                    </a>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-center">
                                <button onclick="prepareEdit('${safeId}')"
                                        class="text-[10px] font-black tracking-tight bg-white border border-emerald-200 text-emerald-700 px-3 py-1.5 rounded-lg hover:bg-emerald-600 hover:text-white transition-all shadow-sm">
                                    EDIT
                                </button>
                            </td>
                        </tr>
                    `;
                });
            });

            const currentSearch = document.getElementById("searchInput").value;
            if (currentSearch.trim() !== "") {
                filterTable();
            }
        }

        window.onload = loadMembers;
    </script>
</body>

</html>
