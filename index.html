<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Standard Page Title & Search Engine Meta Tags -->
    <title>MAMU | Muslim Association of Meru University</title>
    <meta property="og:site_name" content="MAMU" />
    <meta name="description" content="Muslim Association of Meru University (MAMU) Student Registration Portal." />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MAMU",
      "alternateName": "Muslim Association of Meru University",
      "url": "https://mamu36673.github.io/MamuWeb/"
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --islamic-green: #0a4d2e;
            --gold: #fbc02d;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #fdfdfb;
        }

        .islamic-gradient {
            background: linear-gradient(180deg, #10623a 0%, #063820 100%);
            border-bottom: 5px solid var(--gold);
        }
    </style>
</head>

<body>

    <header class="islamic-gradient text-white pt-10 pb-14 shadow-2xl">
        <div class="container mx-auto text-center px-4">
            <h1 class="text-3xl md:text-5xl font-bold mb-2">MAMU Registration Portal</h1>
            <p class="text-emerald-100 italic">BISMILLAH. WELCOME ALL</p>
            <ul class="top-utility-links mt-4">
                <li><a href="https://mamu36673.github.io/MamuWeb/" target="_blank" class="underline hover:text-yellow-300">Back Home</a></li>
            </ul>
        </div>
    </header>

    <main class="container mx-auto px-4 -mt-8 pb-20 max-w-xl">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border-t-4 border-yellow-400">
            <form id="memberForm" class="p-6 md:p-8 space-y-4">
                <h2 class="text-2xl font-bold text-emerald-900 mb-4 text-center">Register Student</h2>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Full Name</label>
                    <input type="text" id="name" placeholder="Enter Full Name" required class="w-full border p-3 rounded-xl bg-gray-50 outline-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">School</label>
                    <select id="school" required class="w-full border p-3 rounded-xl bg-white outline-emerald-500">
                        <option value="">-- Select School --</option>
                        <option>School of Agriculture and Food Science</option>
                        <option>School of Business and Economics</option>
                        <option>School of Computing and Informatics</option>
                        <option>School of Education</option>
                        <option>School of Engineering and Architecture</option>
                        <option>School of Health Sciences</option>
                        <option>School of Nursing</option>
                        <option>School of Pure and Applied Sciences</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Course</label>
                    <input type="text" id="course" placeholder="Enter Course Name" required class="w-full border p-3 rounded-xl bg-gray-50 outline-emerald-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Reg No</label>
                        <input type="text" id="regNo" placeholder="e.g. CT101/..." required class="w-full border p-3 rounded-xl bg-gray-50 outline-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Academic Year</label>
                        <select id="year" class="w-full border p-3 rounded-xl bg-white outline-emerald-500">
                            <option>Year 1</option>
                            <option>Year 2</option>
                            <option>Year 3</option>
                            <option>Year 4</option>
                            <option>Alumni</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Phone Number</label>
                    <input type="tel" id="phone" placeholder="e.g. 0712345678" required class="w-full border p-3 rounded-xl bg-gray-50 outline-emerald-500">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg mt-4">
                    Submit Registration
                </button>
            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById("memberForm");
        const submitBtn = document.getElementById("submitBtn");
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzui9iUzmsk76xbEtJ2a8CJYsDWB2erF1uECGeGhWDN8ofMn6RHOCMZTF6FDXv29_-4sA/exec";

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            const uniqueId = typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : 'id_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);

            const memberData = {
                id: uniqueId,
                name: document.getElementById("name").value.trim(),
                regNo: document.getElementById("regNo").value.trim(),
                school: document.getElementById("school").value,
                course: document.getElementById("course").value.trim(),
                year: document.getElementById("year").value,
                phone: document.getElementById("phone").value.trim(),
                createdAt: Date.now()
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify(memberData)
                });

                const result = await response.json();

                if (result.status === "success") {
                    alert("Registration submitted successfully!");
                    form.reset();
                } else {
                    alert("Submission failed. Please try again.");
                }

            } catch (error) {
                console.error(error);
                alert("Error sending request to Google Sheets. Please check your internet connection.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Registration";
            }
        });
    </script>
</body>

</html>
